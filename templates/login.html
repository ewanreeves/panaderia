{% extends "base.html" %}
{% block title %}Acceder{% endblock %}
{% block content %}
<div class="login-box login-box-ancho">
  <span class="brand-mark">🥐</span>
  <h1>Gestión interna</h1>
  <p class="login-sub">panadería · cafetería</p>

  <div class="login-roles">
    <form method="post" action="{{ url_for('login_caja') }}">
      <button type="submit" class="login-rol-btn">
        <span class="login-rol-icono">🧾</span>
        Caja
      </button>
    </form>
  </div>

  <details class="login-admin">
    <summary>Acceso administración</summary>
    <form method="post">
      <label>Contraseña de {{ admin_nombre }}
        <input type="password" name="password" required>
      </label>
      <button type="submit">Entrar como {{ admin_nombre }}</button>
    </form>
    <form method="post" action="{{ url_for('login_recuperar') }}"
      onsubmit="return confirm('Se generará una contraseña nueva y se enviará por correo. La contraseña actual dejará de funcionar. ¿Seguro?');">
      <button type="submit" class="link olvidado">¿Has olvidado la contraseña?</button>
    </form>
  </details>
</div>
{% endblock %}
